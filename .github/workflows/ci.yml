name: CI

on:
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags and history, for the version below

      # VERSION: the tag without its "v" on tag builds (v1.2.3 -> 1.2.3), otherwise the latest
      # reachable release tag plus the short commit hash (1.2.3+abc1234). Without any release
      # tag yet, package.json's version stands in for the tag. The build reads it from the
      # environment (wxt.config.ts) and shows it at the bottom of the panel.
      - name: Determine version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
            base="${tag#v}"
            [ -n "$base" ] || base=$(node -p "require('./package.json').version")
            version="$base+$(git rev-parse --short HEAD)"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "Version: $version"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: Validate Firefox build (AMO linter)
        run: npm run lint:firefox

      - name: Package
        run: npm run package

      - uses: actions/upload-artifact@v4
        with:
          name: minerva-extensions
          path: dist/*.zip
          if-no-files-found: error
