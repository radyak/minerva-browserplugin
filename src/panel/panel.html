<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Minerva</title>
    <link rel="stylesheet" href="../vendor/bootstrap.min.css" />
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body class="bg-body-tertiary">
    <div class="d-flex flex-column gap-3 p-3 min-vh-100">
      <header class="d-flex align-items-center justify-content-between gap-2">
      </header>

      <form>
        <fieldset class="d-flex flex-column gap-3">
          <div>
            <label for="auction-premium" class="form-label">Auction premium</label>
            <div class="input-group has-validation">
              <input
                type="number"
                class="form-control"
                id="auction-premium"
                min="0"
                max="100"
                step="0.1"
                inputmode="decimal"
                placeholder="0"
                autocomplete="off"
                aria-describedby="auction-premium-help"
              />
              <span class="input-group-text">%</span>
              <div class="invalid-feedback">Enter a percentage between 0 and 100.</div>
            </div>
            <div id="auction-premium-help" class="form-text">
              Buyer's premium the auction house adds on top of the hammer price.
            </div>
          </div>

          <div>
            <label for="shipment" class="form-label">Shipment</label>
            <div class="input-group has-validation">
              <input
                type="number"
                class="form-control"
                id="shipment"
                min="0"
                step="0.01"
                inputmode="decimal"
                placeholder="0.00"
                autocomplete="off"
                aria-describedby="shipment-help"
              />
              <span class="input-group-text">EUR</span>
              <div class="invalid-feedback">Enter an amount of 0 or more.</div>
            </div>
            <div id="shipment-help" class="form-text">
              Flat shipping cost per item. Both values are saved locally while you type.
            </div>
          </div>
        </fieldset>
      </form>

      <!-- Plugin status section, pinned to the bottom of the panel. -->
      <footer class="mt-auto">
        <div class="card shadow-sm w-100">
          <div class="card-header">
            Plugin status
          </div>
          <div class="card-body d-flex align-items-center justify-content-between gap-2">
            <span id="status" class="badge text-bg-secondary">checking…</span>
          </div>
        </div>
      </footer>
    </div>

    <script src="panel.js"></script>
  </body>
</html>
